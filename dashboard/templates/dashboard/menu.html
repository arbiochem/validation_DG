{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Horizontal - Validation & Etat</title>
        <!-- Material Icons -->
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

        <!-- Bootstrap Icons - AJOUTEZ CETTE LIGNE -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        
        <style>
            .content-section {
                display: none;
            }

            .content-section.active {
                display: block;
            }

            .menu-count.active {
                background: #099646 !important; /* vert */
                color: #fff !important;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #ece4c5 0%, #d4c9a8 100%);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                position: relative;
                overflow-x: hidden;
            }

            /* Animated Background Particles */
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: 
                    radial-gradient(circle at 20% 50%, rgba(188, 130, 63, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(9, 150, 70, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 40% 20%, rgba(188, 130, 63, 0.05) 0%, transparent 50%);
                pointer-events: none;
                animation: backgroundShift 15s ease-in-out infinite;
                z-index: 0;
            }

            @keyframes backgroundShift {
                0%, 100% {
                    transform: scale(1) rotate(0deg);
                    opacity: 0.5;
                }
                50% {
                    transform: scale(1.1) rotate(5deg);
                    opacity: 0.8;
                }
            }

            /* Floating Orbs */
            .floating-orb {
                position: fixed;
                border-radius: 50%;
                pointer-events: none;
                z-index: 1;
                animation: float 20s ease-in-out infinite;
                opacity: 0.3;
            }

            .orb1 {
                width: 300px;
                height: 300px;
                background: radial-gradient(circle, rgba(188, 130, 63, 0.3), transparent);
                top: -100px;
                left: -100px;
                animation-delay: 0s;
            }

            .orb2 {
                width: 200px;
                height: 200px;
                background: radial-gradient(circle, rgba(9, 150, 70, 0.3), transparent);
                bottom: -50px;
                right: -50px;
                animation-delay: 5s;
            }

            .orb3 {
                width: 250px;
                height: 250px;
                background: radial-gradient(circle, rgba(188, 130, 63, 0.2), transparent);
                top: 50%;
                right: -100px;
                animation-delay: 10s;
            }

            @keyframes float {
                0%, 100% {
                    transform: translate(0, 0) scale(1);
                }
                25% {
                    transform: translate(50px, -50px) scale(1.1);
                }
                50% {
                    transform: translate(-30px, 30px) scale(0.9);
                }
                75% {
                    transform: translate(40px, 20px) scale(1.05);
                }
            }

            /* Header with Logo and Menu */
            .header {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
                border-bottom: 4px solid #bc823f;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .header::before {
                content: '';
                position: absolute;
                bottom: -4px;
                left: 0;
                width: 0;
                height: 4px;
                background: linear-gradient(90deg, #099646, #bc823f);
                transition: width 0.6s ease;
            }

            .header:hover::before {
                width: 100%;
            }

            .header-container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 20px 40px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 30px;
                flex-wrap: wrap;
                position: relative;
                z-index: 2;
            }

            /* Logo */
            .logo-container {
                display: flex;
                align-items: center;
                gap: 15px;
                cursor: pointer;
                transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                position: relative;
            }

            .logo-container::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                background: radial-gradient(circle, rgba(188, 130, 63, 0.2), transparent);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                transition: all 0.5s ease;
            }

            .logo-container:hover::before {
                width: 200px;
                height: 200px;
            }

            .logo-container:hover {
                transform: scale(1.08) rotate(2deg);
            }

            .logo {
                width: 180px;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                color: #ece4c5;
                font-weight: 800;
                position: relative;
                overflow: hidden;
                border-radius: 12px;
                filter: drop-shadow(0 4px 15px rgba(188, 130, 63, 0.3));
                transition: all 0.4s ease;
            }

            .logo-container:hover .logo {
                filter: drop-shadow(0 8px 25px rgba(188, 130, 63, 0.5));
            }

            .logo::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
                animation: logoShine 4s linear infinite;
            }

            @keyframes logoShine {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            /* Horizontal Menu */
            .horizontal-menu {
                display: flex;
                gap: 20px;
                align-items: center;
                flex-wrap: wrap;
            }

            /* Menu Items */
            .menu-item {
                position: relative;
                padding: 20px 40px;
                background: linear-gradient(135deg, #bc823f 0%, #a07235 100%);
                color: #ece4c5;
                text-decoration: none;
                font-size: 1.15rem;
                font-weight: 700;
                border-radius: 50px;
                display: flex;
                align-items: center;
                gap: 12px;
                cursor: pointer;
                transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                overflow: hidden;
                border: 3px solid transparent;
                box-shadow: 0 8px 25px rgba(188, 130, 63, 0.4);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .menu-item::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
                transition: left 0.7s ease;
            }

            .menu-item:hover::before {
                left: 100%;
            }

            .menu-item::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                border-radius: 50%;
                background: rgba(9, 150, 70, 0.3);
                transform: translate(-50%, -50%);
                transition: width 0.6s ease, height 0.6s ease;
            }

            .menu-item:hover::after {
                width: 400px;
                height: 400px;
            }

            .menu-item:hover {
                transform: translateY(-8px) scale(1.08);
                box-shadow: 0 20px 50px rgba(188, 130, 63, 0.7), 0 0 30px rgba(9, 150, 70, 0.5);
                border-color: #099646;
                background: linear-gradient(135deg, #099646 0%, #077a37 100%);
            }

            .menu-item:active {
                transform: translateY(-4px) scale(1.04);
            }

            .menu-icon {
                font-size: 1.8rem;
                display: inline-block;
                transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
            }

            .menu-item:hover .menu-icon {
                transform: rotate(360deg) scale(1.3);
                filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.5));
            }

            .menu-text {
                position: relative;
                z-index: 1;
            }

            .menu-item.active {
                background: linear-gradient(135deg, #099646 0%, #077a37 100%);
                border-color: #ece4c5;
                box-shadow: 0 15px 40px rgba(9, 150, 70, 0.6), 0 0 40px rgba(9, 150, 70, 0.4);
            }

            /* Logout Button */
            .logout-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: #ece4c5;
                color: #099646;
                text-decoration: none;
                font-weight: 600;
                padding: 10px 20px;
                border-radius: 30px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
                transition: all 0.3s ease;
            }

            .logout-btn .material-icons {
                font-size: 22px;
                transition: transform 0.3s ease;
            }

            .logout-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
                background: #099646;
                color: white;
            }

            .logout-btn:hover .material-icons {
                transform: rotate(180deg);
            }

            .username {
                font-weight: 700;
                letter-spacing: 1px;
            }

            /* Main Content - ONE PAGE SECTIONS */
            .main-content {
                flex: 1;
                position: relative;
                z-index: 2;
                padding-top: 120px; /* Space for fixed header */
            }

            /* Content Sections - ONE PAGE STYLE */
            .content-section {
                min-height: calc(100vh - 120px - 80px); /* header + footer */
                padding: 60px 20px;
                position: relative;   /* 🔥 clé */
                width: 100%;
                opacity: 0;
                visibility: hidden;
                transform: translateY(50px);
                transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            }

            .content-section.active {
                opacity: 1;
                visibility: visible;
                position: relative;
                transform: translateY(0);
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
            }

            /* Search Bar */
            .search-wrapper {
                margin-bottom: 30px;
                display: flex;
                justify-content: center;
            }

            .search-container {
                position: relative;
                width: 100%;
                max-width: 500px;
            }

            .search-icon {
                position: absolute;
                top: 50%;
                left: 15px;
                transform: translateY(-50%);
                color: #BC823F;
                font-size: 24px;
                pointer-events: none;
                z-index: 1;
            }

            #searchInput {
                width: 100%;
                padding: 12px 20px 12px 50px;
                border: 2px solid #BC823F;
                border-radius: 25px;
                font-size: 14px;
                transition: all 0.3s ease;
            }

            #searchInput:focus {
                outline: none;
                border-color: #099646;
                box-shadow: 0 0 10px rgba(9, 150, 70, 0.3);
            }

            /* Document Card */
            .document-card {
                background: white;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                margin-bottom: 30px;
                overflow: hidden;
                transition: all 0.3s ease;
            }

            .document-card:hover {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            }

            .document-header {
                background: white;
                color: green;
                padding: 20px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .document-info h3 {
                margin: 0 0 8px 0;
                font-size: 1.4rem;
                font-weight: 600;
            }

            .document-meta {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-size: 0.9rem;
            }

            .document-meta span {
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .expand-btn {
                background: rgba(188, 130, 63, 0.1);
                border: 2px solid #bc823f;
                color: #bc823f;
                padding: 8px 20px;
                border-radius: 20px;
                cursor: pointer;
                transition: all 0.3s ease;
                font-weight: 600;
            }

            .expand-btn:hover {
                background: #bc823f;
                color: white;
            }

            .lines-container {
                padding: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.4s ease;
            }

            .lines-container.expanded {
                max-height: 2000px;
                padding: 20px 0;
            }

            .table-responsive {
                padding: 0 30px 20px 30px;
                overflow-x: auto;
            }

            .lines-table {
                width: 100%;
                border-collapse: collapse;
            }

            .lines-table thead {
                background: #f5f7fa;
            }

            .lines-table thead th {
                padding: 12px;
                text-align: left;
                font-weight: 600;
                color: #BC823F;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                border-bottom: 2px solid #BC823F;
            }

            .lines-table tbody tr {
                border-bottom: 1px solid #e0e0e0;
                transition: all 0.3s ease;
            }

            .lines-table tbody tr:hover {
                background: #f9fafb;
            }

            .lines-table tbody td {
                padding: 12px;
                color: #333;
                font-size: 14px;
            }

            /* Epic Button */
            .btn-epic {
                position: relative;
                padding: 8px 18px;
                background: linear-gradient(135deg, #00eaff, #008cff);
                border: none;
                border-radius: 30px;
                color: white;
                font-size: 14px;
                font-weight: bold;
                letter-spacing: 1px;
                cursor: pointer;
                overflow: hidden;
                z-index: 1;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                box-shadow: 0 0 12px #BC823F;
            }

            .btn-epic:hover {
                transform: scale(1.06);
                box-shadow: 0 0 25px #BC823F;
                background: linear-gradient(135deg, #BC823F, #00eaff);
            }

            /* Stats Grid for Etat Global */
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 25px;
                margin: 40px 0;
            }

            .stat-card {
                background: linear-gradient(135deg, #bc823f 0%, #a07235 100%);
                padding: 30px;
                border-radius: 20px;
                text-align: center;
                box-shadow: 0 10px 30px rgba(188, 130, 63, 0.4);
                transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
                border: 3px solid transparent;
            }

            .stat-card:hover {
                transform: translateY(-10px) scale(1.05);
                box-shadow: 0 20px 50px rgba(188, 130, 63, 0.6);
                border-color: #099646;
                background: linear-gradient(135deg, #099646 0%, #077a37 100%);
            }

            .stat-value {
                font-size: 3rem;
                font-weight: 900;
                color: #ece4c5;
                margin-bottom: 10px;
            }

            .stat-label {
                font-size: 1.1rem;
                color: #ece4c5;
                font-weight: 600;
                margin-bottom: 8px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .stat-trend {
                font-size: 0.95rem;
                color: rgba(236, 228, 197, 0.8);
            }

            .chart-placeholder {
                background: rgba(255, 255, 255, 0.9);
                padding: 40px;
                border-radius: 20px;
                margin-top: 40px;
                border: 3px solid rgba(188, 130, 63, 0.3);
            }

            .chart-title {
                font-size: 1.5rem;
                color: #bc823f;
                font-weight: 700;
                margin-bottom: 30px;
            }

            .chart-bars {
                display: flex;
                justify-content: space-around;
                align-items: flex-end;
                gap: 20px;
                height: 200px;
            }

            .chart-bar {
                flex: 1;
                background: linear-gradient(180deg, #099646 0%, #bc823f 100%);
                border-radius: 10px 10px 0 0;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding-bottom: 10px;
                color: white;
                font-weight: 700;
                transition: all 0.3s ease;
                cursor: pointer;
                box-shadow: 0 5px 15px rgba(188, 130, 63, 0.3);
            }

            .chart-bar:hover {
                transform: scale(1.05);
                box-shadow: 0 10px 30px rgba(9, 150, 70, 0.5);
            }

            .content-box {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(236, 228, 197, 0.95) 100%);
                backdrop-filter: blur(20px);
                border-radius: 30px;
                padding: 60px;
                box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
                border: 4px solid rgba(188, 130, 63, 0.3);
            }

            .content-title {
                font-size: 3rem;
                background: linear-gradient(135deg, #bc823f 0%, #099646 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin-bottom: 25px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 2px;
                text-align: center;
            }

            .content-text {
                font-size: 1.3rem;
                color: #444;
                line-height: 2;
                text-align: center;
                margin-bottom: 40px;
            }

            /* Footer */
            .footer {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                color: #ece4c5;
                text-align: center;
                border-top: 5px solid #099646;
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);
                position: relative;
                z-index: 2;
            }

            .footer p {
                color: #bc823f;
                font-size: 14px;
                font-weight: bold;
                margin: 0;
                padding: 12px;
            }

            .no-lines {
                text-align: center;
                padding: 40px;
                color: #999;
                font-style: italic;
            }

            /* Responsive */
            @media (max-width: 768px) {
                .header-container {
                    padding: 15px 20px;
                    justify-content: center;
                }

                .logo {
                    width: 140px;
                    height: 50px;
                }

                .horizontal-menu {
                    justify-content: center;
                    width: 100%;
                }

                .menu-item {
                    padding: 16px 30px;
                    font-size: 1rem;
                }

                .content-section {
                    padding: 40px 15px;
                }

                .content-box {
                    padding: 40px 30px;
                }

                .content-title {
                    font-size: 2.2rem;
                }

                .content-text {
                    font-size: 1.1rem;
                }

                .stats-grid {
                    grid-template-columns: 1fr;
                }

                .chart-bars {
                    gap: 10px;
                    height: 150px;
                }

                .document-header {
                    padding: 15px 20px;
                }

                .table-responsive {
                    padding: 0 15px 15px 15px;
                }

                .main-content {
                    padding-top: 100px;
                }
            }
        </style>
    </head>

    <body>
        <!-- Floating Orbs -->
        <div class="floating-orb orb1"></div>
        <div class="floating-orb orb2"></div>
        <div class="floating-orb orb3"></div>

        <!-- Header -->
        <header class="header" id="mainHeader">
            <div class="header-container">
                <div class="logo-container">
                    <img src="{% static 'dashboard/logo.jpeg' %}" alt="Logo Société" class="logo">
                </div>

                <nav class="horizontal-menu">
                    <a href="{% url 'validation' %}" class="menu-item">
                        <span class="menu-icon">✓</span>
                        <span class="menu-text">Validation Achat</span>
                        <span class="menu-count" style="
                            background: #bc823f;
                            color: #fff;
                            font-size: 0.8rem;
                            font-weight: bold;
                            padding: 2px 8px;
                            border-radius: 12px;
                            margin-left: 8px;
                            display: inline-block;
                        ">
                            0
                        </span>
                    </a>

                    <a href="{% url 'etat' %}" class="menu-item">
                        <span class="menu-icon">📊</span>
                        <span class="menu-text">Etat Global</span>
                    </a>
                </nav>

                <div>
                    <a href="{% url 'logout' %}" class="logout-btn">
                        <span class="username">admin</span>
                        <i class="material-icons">logout</i>
                    </a>
                </div>
            </div>
        </header>

        <!-- ✅ MAIN CONTENT - Ajoutez vos sections ici -->
        <main class="main-content">
           
        </main>

        <!-- ✅ FOOTER - Après le main -->
        <footer class="footer">
            <p>
                Développé par l'équipe <strong>IT Arbiochem</strong> © {% now "Y" %}
            </p>
        </footer>
    </body>
</html>
